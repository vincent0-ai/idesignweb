<!--
  Service Card Component Primitive
  Flat clean hairline border, sleek typography, zero clutter.
-->
<article class="card-service">
  <div>
    <div class="card-service-header">
      <span class="card-service-numeral">{{ service.service_number }}</span>
    </div>
    <h3 class="card-service-title">{{ service.title }}</h3>
    <p class="card-service-tagline">{{ service.tagline }}</p>
  </div>

  <div style="margin-top: var(--space-md);">
    <a href="{% url 'public:service_detail' service.slug %}" class="btn btn-outline btn-block btn-sm">
      Learn More
    </a>
  </div>
</article>
