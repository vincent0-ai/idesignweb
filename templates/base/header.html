<header class="site-header">
  <div class="container header-inner">
    <!-- Brand Wordmark -->
    <a href="{% url 'public:home' %}" class="brand-mark" aria-label="idesignweb homepage">
      <span class="brand-dot"></span>
      <span>IDESIGNWEB</span>
      <span class="brand-sub">STUDIO</span>
    </a>

    <!-- Mobile Nav Toggle -->
    <button type="button" class="mobile-nav-toggle" aria-expanded="false" aria-controls="main-nav" id="mobileNavBtn">
      Menu
    </button>

    <!-- Main Navigation Bar -->
    <nav id="main-nav" class="main-nav" aria-label="Main Navigation">
      {% for item in main_nav_items %}
        <a href="{% url item.url_name %}" class="nav-link {% if request.resolver_match.view_name == item.url_name %}active{% endif %}">
          <span>{{ item.label }}</span>
        </a>
      {% endfor %}
    </nav>

    <!-- Action / Member Access Area -->
    <div class="header-actions">
      <a href="{% url 'public:contact' %}" class="btn btn-primary btn-sm">
        Start a Project
      </a>
      {% if user.is_authenticated %}
        <a href="{% url 'portal:dashboard' %}" class="btn btn-secondary btn-sm">
          Portal
        </a>
      {% else %}
        <a href="{% url 'portal:login' %}" class="btn btn-secondary btn-sm">
          Client Login
        </a>
      {% endif %}
    </div>
  </div>
</header>
