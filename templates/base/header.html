<header class="site-header">
  <div class="container header-inner">
    <!-- Pure Typographic Wordmark -->
    <a href="{% url 'public:home' %}" class="brand-mark" aria-label="idesignweb homepage">
      <span>IDESIGNWEB</span>
      <span class="brand-sub">SOLUTIONS</span>
    </a>

    <!-- Mobile Nav Toggle -->
    <button type="button" class="mobile-nav-toggle" aria-expanded="false" aria-controls="main-nav">
      [ MENU ]
    </button>

    <!-- Main Navigation Bar -->
    <nav id="main-nav" class="main-nav" aria-label="Main Navigation">
      {% for item in main_nav_items %}
        <a href="{% url item.url_name %}" class="nav-link">
          <span class="nav-numeral">{{ item.numeral }}</span>
          <span>{{ item.label }}</span>
        </a>
      {% endfor %}
    </nav>

    <!-- Action / Member Access Area -->
    <div class="header-actions">
      {% if user.is_authenticated %}
        <a href="{% url 'portal:dashboard' %}" class="btn btn-secondary btn-sm">
          PORTAL : {{ user.username }}
        </a>
        <a href="{% url 'portal:logout' %}" class="btn btn-ghost btn-sm">
          LOGOUT
        </a>
      {% else %}
        <a href="{% url 'portal:login' %}" class="btn btn-secondary btn-sm">
          MEMBER LOGIN
        </a>
      {% endif %}
    </div>
  </div>
</header>
