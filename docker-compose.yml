services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-secret-change-me}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-idesignweb_db}
      - DATABASE_PATH=/app/data/db.sqlite3
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
    volumes:
      - app_data:/app/data
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_data:
  mongo_data:
